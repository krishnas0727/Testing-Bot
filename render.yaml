services:
  # ───────────────────────────────────────────────────────────────────────────
  # PRODUCTION WEB SERVICE (REST API & DASHBOARD SPA)
  # ───────────────────────────────────────────────────────────────────────────
  - type: web
    name: dex-arbitrage-api
    env: python
    plan: standard
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /api/health
    autoDeploy: false # Prevent accidental automatic deployments enabling live trading
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 5000
      - key: TRADING_MODE
        value: MOCK # Must start in safe MOCK mode
      - key: AUTO_TRADE_ENABLED
        value: "false"
      - key: LIVE_TRADING_ARMED
        value: "false"
      - key: EMERGENCY_STOP
        value: "false"
      - key: CHAIN_ID
        value: "8453"
      - key: DEFAULT_CHAIN
        value: base
      - key: BASE_RPC_URL
        sync: false # Set securely in Render dashboard
      - key: ARBITRAGE_CONTRACT_ADDRESS
        sync: false
      - key: TREASURY_CONTRACT_ADDRESS
        sync: false
      - key: WALLET_ADDRESS
        sync: false
      - key: PRIVATE_KEY
        sync: false # Injected as secret environment variable
      - key: API_AUTH_TOKEN
        sync: false # Required secret auth token for protected API endpoints (e.g. /api/trade)
