services:
  - type: web
    name: dex-arbitrage-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRADING_MODE
        value: MOCK
      - key: DEFAULT_CHAIN
        value: base
      - key: CHAIN_ID
        value: 8453
      - key: AUTO_TRADE_ENABLED
        value: "false"
      - key: EMERGENCY_STOP
        value: "false"
